<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Belt Showcase Board</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <div class="dropzone" id="dropzone" onclick="document.getElementById('csv-file').click()">
      <div class="drop-text">Click or Drop Membership CSV File Here</div>
      <input type="file" id="csv-file" accept=".csv" />
    </div>

    <div class="controls" id="controls" style="display: none;">
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Search ninja name..." oninput="filterNinjas()" />
      </div>
      <div class="stats-bar">
        <span class="stat-badge" id="total-count">Total: 0</span>
      </div>
    </div>

    <div class="showcase-board" id="showcase-board"></div>
  </div>

  <script src="main.js"></script>
</body>
</html>
